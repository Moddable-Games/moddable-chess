<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Variant Candidates Review</title>
<style>
body { font-family: -apple-system, system-ui, sans-serif; max-width: 1200px; margin: 0 auto; padding: 2rem; background: #1a1a2e; color: #e0e0e0; line-height: 1.6; }
h1 { color: #fff; border-bottom: 2px solid #444; padding-bottom: 0.5rem; }
h2 { color: #7ecfff; margin-top: 2.5rem; }
h3 { color: #a0d0a0; }
blockquote { border-left: 3px solid #555; padding-left: 1rem; color: #aaa; }
table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.9rem; }
th { background: #2a2a4e; color: #7ecfff; text-align: left; padding: 0.6rem 0.8rem; position: sticky; top: 0; }
td { padding: 0.5rem 0.8rem; border-bottom: 1px solid #333; vertical-align: top; }
tr:hover td { background: #252540; }
strong { color: #fff; }
code { background: #2a2a4e; padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.85em; }
del { color: #666; }
em { color: #aaa; }
hr { border: none; border-top: 1px solid #444; margin: 2rem 0; }
ul, ol { padding-left: 1.5rem; }
li { margin: 0.3rem 0; }
.loading { text-align: center; padding: 3rem; color: #666; }
</style>
</head>
<body>
<div id="content" class="loading">Loading document...</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
fetch('VARIANT-CANDIDATES.md')
  .then(r => r.text())
  .then(md => {
    document.getElementById('content').innerHTML = marked.parse(md);
  })
  .catch(e => {
    document.getElementById('content').textContent = 'Error loading: ' + e.message;
  });
</script>
</body>
</html>
